name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test*/*.xml'

  build-debug:
    name: Build Debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

  coverage:
    name: Coverage
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Generate coverage reports
        run: ./gradlew :core:common:koverXmlReport :core:domain:koverXmlReport :core:network:koverXmlReport :feature:auth:koverXmlReport :feature:transactions:koverXmlReport --continue

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const files = execSync('find . -path "*/build/reports/kover/report.xml"')
              .toString().trim().split('\n').filter(Boolean);

            if (files.length === 0) {
              console.log('No coverage reports found, skipping comment.');
              return;
            }

            const combined = files.map(f => fs.readFileSync(f, 'utf8')).join('\n');
            const modules = files.map(f => f.replace(/^\.\//, '').replace(/\/build.*$/, ''));

            function parseCoverage(type) {
              const regex = new RegExp(`<counter type="${type}" missed="(\\d+)" covered="(\\d+)"`, 'g');
              let missed = 0, covered = 0, match;
              while ((match = regex.exec(combined)) !== null) {
                missed += parseInt(match[1]);
                covered += parseInt(match[2]);
              }
              const total = missed + covered;
              const pct = total === 0 ? 0 : ((covered / total) * 100).toFixed(1);
              return { covered, total, pct };
            }

            const line = parseCoverage('LINE');
            const branch = parseCoverage('BRANCH');
            const instruction = parseCoverage('INSTRUCTION');

            function badge(pct) {
              if (pct >= 80) return '🟢';
              if (pct >= 60) return '🟡';
              return '🔴';
            }

            const moduleList = modules.map(m => `\`${m}\``).join(' · ');

            const body = [
              '## 📊 Cobertura de testes',
              '',
              '| Tipo | Cobertura | Linhas |',
              '|------|-----------|--------|',
              `| ${badge(line.pct)} Linhas | ${line.pct}% | ${line.covered}/${line.total} |`,
              `| ${badge(branch.pct)} Branches | ${branch.pct}% | ${branch.covered}/${branch.total} |`,
              `| ${badge(instruction.pct)} Instruções | ${instruction.pct}% | ${instruction.covered}/${instruction.total} |`,
              '',
              `<details><summary>Módulos cobertos (${modules.length})</summary>`,
              '',
              moduleList,
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('📊 Cobertura de testes')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
