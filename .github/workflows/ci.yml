name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests with coverage
        run: ./gradlew :core:ui:testDebugUnitTestCoverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test*/*.xml'

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/**/*.xml'

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate coverage report
        run: ./gradlew :core:ui:testDebugUnitTestCoverage

      - name: Comment coverage on PR
        uses: madrapps/jacoco-report@v1.6.0
        with:
          paths: ${{ github.workspace }}/core/ui/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage Report — core:ui
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          update-comment: true
          pass-emoji: ✅
          fail-emoji: ⚠️

  build-debug:
    name: Build Debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run tests and generate coverage reports
        run: ./gradlew :core:common:createDebugUnitTestCoverageReport :core:domain:createDebugUnitTestCoverageReport :core:network:createDebugUnitTestCoverageReport :feature:auth:createDebugUnitTestCoverageReport :feature:transactions:createDebugUnitTestCoverageReport --continue

      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const files = execSync('find . -path "*/build/reports/coverage/test/debug/report.xml" -not -path "*/build-logic/*"')
              .toString().trim().split('\n').filter(Boolean);

            if (files.length === 0) {
              console.log('No coverage reports found, skipping comment.');
              return;
            }

            function parseCounters(xml) {
              const result = {};
              const re = /<counter type="(\w+)" missed="(\d+)" covered="(\d+)"/g;
              let m;
              while ((m = re.exec(xml)) !== null) {
                const t = m[1];
                if (!result[t]) result[t] = { missed: 0, covered: 0 };
                result[t].missed += parseInt(m[2]);
                result[t].covered += parseInt(m[3]);
              }
              return result;
            }

            function pct(c) {
              const total = c.missed + c.covered;
              return total === 0 ? 0 : ((c.covered / total) * 100).toFixed(1);
            }

            function badge(p) {
              if (p >= 80) return '🟢';
              if (p >= 60) return '🟡';
              return '🔴';
            }

            // Per-file breakdown
            function parseFiles(xml, moduleName) {
              const rows = [];
              const pkgRe = /<package name="([^"]+)">([\s\S]*?)<\/package>/g;
              let pkgMatch;
              while ((pkgMatch = pkgRe.exec(xml)) !== null) {
                const pkg = pkgMatch[1];
                const pkgBody = pkgMatch[2];
                const sfRe = /<sourcefile name="([^"]+)">([\s\S]*?)<\/sourcefile>/g;
                let sfMatch;
                while ((sfMatch = sfRe.exec(pkgBody)) !== null) {
                  const fname = sfMatch[1];
                  const sfBody = sfMatch[2];
                  const lineRe = /<counter type="LINE" missed="(\d+)" covered="(\d+)"/;
                  const lm = lineRe.exec(sfBody);
                  if (!lm) continue;
                  const missed = parseInt(lm[1]), covered = parseInt(lm[2]);
                  const total = missed + covered;
                  if (total === 0) continue;
                  const p = parseFloat(((covered / total) * 100).toFixed(1));
                  rows.push({ file: `${pkg}/${fname}`, p, covered, total });
                }
              }
              return rows;
            }

            let totalCounters = {};
            let allFiles = [];

            for (const f of files) {
              const xml = fs.readFileSync(f, 'utf8');
              const module = f.replace(/^\.\//, '').replace(/\/build.*$/, '');
              const counters = parseCounters(xml);
              for (const [t, c] of Object.entries(counters)) {
                if (!totalCounters[t]) totalCounters[t] = { missed: 0, covered: 0 };
                totalCounters[t].missed += c.missed;
                totalCounters[t].covered += c.covered;
              }
              allFiles.push(...parseFiles(xml, module));
            }

            const line = totalCounters['LINE'] || { missed: 0, covered: 0 };
            const branch = totalCounters['BRANCH'] || { missed: 0, covered: 0 };
            const instr = totalCounters['INSTRUCTION'] || { missed: 0, covered: 0 };
            const linePct = pct(line), branchPct = pct(branch), instrPct = pct(instr);

            allFiles.sort((a, b) => a.p - b.p);
            const fileRows = allFiles.map(r => {
              const shortName = r.file.split('/').slice(-2).join('/').replace('.kt', '');
              return `| ${badge(r.p)} \`${shortName}\` | ${r.p}% | ${r.covered}/${r.total} |`;
            });

            const body = [
              '## 📊 Cobertura de testes',
              '',
              '| Tipo | Cobertura | Linhas |',
              '|------|-----------|--------|',
              `| ${badge(linePct)} Linhas | ${linePct}% | ${line.covered}/${line.missed + line.covered} |`,
              `| ${badge(branchPct)} Branches | ${branchPct}% | ${branch.covered}/${branch.missed + branch.covered} |`,
              `| ${badge(instrPct)} Instruções | ${instrPct}% | ${instr.covered}/${instr.missed + instr.covered} |`,
              '',
              '<details><summary>Por arquivo</summary>',
              '',
              '| Arquivo | Linhas | Cobertas |',
              '|---------|--------|----------|',
              ...fileRows,
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('📊 Cobertura de testes')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
